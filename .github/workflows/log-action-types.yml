name: Log action types

# Fails the build when src/lib/log-action-types.generated.ts drifts from the
# public.logs `logs_action_type_check` CHECK constraint in the database.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-generated-enum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fail fast before any verification script runs: if the token is
      # missing or blank the downstream steps would fail with confusing
      # auth errors, so surface the real problem immediately.
      - name: Preflight — CI_ENUM_CHECK_TOKEN present
        env:
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: |
          if [ -z "${CI_ENUM_CHECK_TOKEN}" ]; then
            echo "::error::CI_ENUM_CHECK_TOKEN is missing or blank. Add it under Settings → Secrets and variables → Actions before re-running this workflow."
            exit 1
          fi
          echo "CI_ENUM_CHECK_TOKEN is set."

      # Token verification: confirms CI and the deployed app hold the SAME
      # CI_ENUM_CHECK_TOKEN by comparing truncated sha256 fingerprints. Touches
      # no database and never prints the token.
      - name: Verify CI_ENUM_CHECK_TOKEN (fingerprint match)
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: bash scripts/ci-enum-token-verify.sh

      # Preflight: the scoped CI token and the constraint endpoint must both be
      # usable. No database credential is involved — the endpoint reads
      # pg_constraint server-side and returns only the allowed value list.
      - name: Enum endpoint preflight (token + reachability)
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: bash scripts/ci-enum-endpoint-preflight.sh

      - name: Regenerate and check for drift
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: node scripts/generate-log-action-types.mjs --check --source=http

      - name: Show diff on failure
        if: failure()
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: |
          node scripts/generate-log-action-types.mjs --source=http || true
          git --no-pager diff -- src/lib/log-action-types.generated.ts || true

  # Blocks merges when the action_type coverage test fails: every value in the
  # generated enum must have presentation metadata and be exercised by tests.
  coverage-test:
    name: Action type coverage test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run log action type coverage test
        run: bunx vitest run src/lib/log-action-types-coverage.test.ts --reporter=verbose

      # Fails when app code hardcodes an action_type instead of importing the
      # generated whitelist shared by the frontend and backend.
      - name: Enforce single source of action types
        run: bunx vitest run src/lib/log-action-types.single-source.test.ts --reporter=verbose

  # Lints every GitHub Actions workflow YAML and enforces the Node.js version
  # stays pinned to 24 across all setup-node steps.
  workflow-lint:
    name: Workflow lint & Node version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          # actionlint is a linter for GitHub Actions workflow files. It
          # catches syntax errors, deprecated syntax, and common mistakes.
          docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -color

      - name: Enforce Node.js 24 on all setup-node steps
        run: |
          # Matches only YAML keys (`^\s*node-version:`) so comment lines
          # and inline references to this check don't false-positive.
          set -euo pipefail
          offenders="$(grep -RInE --exclude-dir=node_modules '^\s*node-version:' .github/workflows | grep -v 'node-version: 24' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::One or more setup-node steps are not pinned to Node.js 24:"
            echo "$offenders"
            exit 1
          fi
          echo "All setup-node steps are pinned to Node.js 24."

