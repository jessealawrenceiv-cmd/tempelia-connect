name: Log action types

# Fails the build when src/lib/log-action-types.generated.ts drifts from the
# public.logs `logs_action_type_check` CHECK constraint in the database.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-generated-enum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Preflight: the scoped CI token and the constraint endpoint must both be
      # usable. No database credential is involved — the endpoint reads
      # pg_constraint server-side and returns only the allowed value list.
      - name: Enum endpoint preflight (token + reachability)
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: bash scripts/ci-enum-endpoint-preflight.sh

      - name: Regenerate and check for drift
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: node scripts/generate-log-action-types.mjs --check --source=http

      - name: Show diff on failure
        if: failure()
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: |
          node scripts/generate-log-action-types.mjs --source=http || true
          git --no-pager diff -- src/lib/log-action-types.generated.ts || true

  # Blocks merges when the action_type coverage test fails: every value in the
  # generated enum must have presentation metadata and be exercised by tests.
  coverage-test:
    name: Action type coverage test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run log action type coverage test
        run: bunx vitest run src/lib/log-action-types-coverage.test.ts --reporter=verbose

      # Fails when app code hardcodes an action_type instead of importing the
      # generated whitelist shared by the frontend and backend.
      - name: Enforce single source of action types
        run: bunx vitest run src/lib/log-action-types.single-source.test.ts --reporter=verbose

