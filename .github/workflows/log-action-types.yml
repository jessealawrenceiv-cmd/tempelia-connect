name: Log action types

# Fails the build when src/lib/log-action-types.generated.ts drifts from the
# public.logs `logs_action_type_check` CHECK constraint in the database.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-generated-enum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fail fast before any verification script runs: if the token is
      # missing or blank the downstream steps would fail with confusing
      # auth errors, so surface the real problem immediately.
      - name: Preflight — CI_ENUM_CHECK_TOKEN present
        env:
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: |
          if [ -z "${CI_ENUM_CHECK_TOKEN}" ]; then
            echo "::error::CI_ENUM_CHECK_TOKEN is missing or blank. Add it under Settings → Secrets and variables → Actions before re-running this workflow."
            exit 1
          fi
          echo "CI_ENUM_CHECK_TOKEN is set."

      # Token verification: confirms CI and the deployed app hold the SAME
      # CI_ENUM_CHECK_TOKEN by comparing truncated sha256 fingerprints. Touches
      # no database and never prints the token.
      - name: Verify CI_ENUM_CHECK_TOKEN (fingerprint match)
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: bash scripts/ci-enum-token-verify.sh

      # Preflight: the scoped CI token and the constraint endpoint must both be
      # usable. No database credential is involved — the endpoint reads
      # pg_constraint server-side and returns only the allowed value list.
      - name: Enum endpoint preflight (token + reachability)
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: bash scripts/ci-enum-endpoint-preflight.sh

      - name: Regenerate and check for drift
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: node scripts/generate-log-action-types.mjs --check --source=http

      - name: Show diff on failure
        if: failure()
        env:
          LOG_ACTION_TYPES_URL: ${{ vars.LOG_ACTION_TYPES_URL || 'https://project--8e32f1fd-252b-4fe0-a35d-4ff20cd7fded.lovable.app/api/public/log-action-types/constraint' }}
          CI_ENUM_CHECK_TOKEN: ${{ secrets.CI_ENUM_CHECK_TOKEN }}
        run: |
          node scripts/generate-log-action-types.mjs --source=http || true
          git --no-pager diff -- src/lib/log-action-types.generated.ts || true

  # Blocks merges when the action_type coverage test fails: every value in the
  # generated enum must have presentation metadata and be exercised by tests.
  coverage-test:
    name: Action type coverage test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run log action type coverage test
        run: bunx vitest run src/lib/log-action-types-coverage.test.ts --reporter=verbose

      # Fails when app code hardcodes an action_type instead of importing the
      # generated whitelist shared by the frontend and backend.
      - name: Enforce single source of action types
        run: bunx vitest run src/lib/log-action-types.single-source.test.ts --reporter=verbose

  # Lints every GitHub Actions workflow YAML and enforces the Node.js version
  # stays pinned to 24 across all setup-node steps.
  workflow-lint:
    name: Workflow lint & Node version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          # actionlint is a linter for GitHub Actions workflow files. It
          # catches syntax errors, deprecated syntax, and common mistakes.
          docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -color

      - name: Enforce explicit Node.js 24.x pin on all setup-node steps
        run: |
          # Parses each workflow's YAML structure (PyYAML, preinstalled on
          # ubuntu-latest) via yaml.compose, which preserves start_mark.line for
          # every key. Because it walks parsed YAML nodes — not raw text —
          # comments, examples, and inline references to this check can never
          # cause a false positive, and every offender is reported with its
          # exact file path and line number.
          #
          # An "explicit 24.x pin" is a `with.node-version` value whose major
          # version is 24 and that names a concrete pin rather than an
          # indirect/range form. Accepted: 24, "24", 24.x, 24.0.0, 24.4.1,
          # ^24, ~24.0.0. Rejected: 20/20.x (wrong major), latest, lts/*, *,
          # ranges (>=24, 24 - 25, 24,25), an empty value, and node-version-file
          # (indirect — pin an explicit node-version instead).
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys, yaml

          OK_MAJOR = 24

          def get_mapping_value(node, key):
              if node is None or not isinstance(node, yaml.MappingNode):
                  return None
              for k, v in node.value:
                  if isinstance(k, yaml.ScalarNode) and k.value == key:
                      return v
              return None

          def scalar(node):
              return node.value if isinstance(node, yaml.ScalarNode) else None

          def classify(nv):
              """('ok',) for an explicit 24.x pin, else ('bad', reason)."""
              s = str(nv).strip()
              if not s:
                  return ("bad", "node-version is empty — pin explicitly to 24.x")
              low = s.lower()
              if low == "latest" or low.startswith("lts/") or s == "*":
                  return ("bad", f"'{s}' is not an explicit version pin "
                                  f"(use {OK_MAJOR}.x)")
              if any(tok in s for tok in ("||", " - ", ">", "<", ",")):
                  return ("bad", f"'{s}' is a version range, not an explicit "
                                  f"{OK_MAJOR}.x pin")
              body = re.sub(r"^[~^= ]+", "", s).lstrip("vV")
              m = re.match(r"^(\d+)(?:\.(?:x|\d+)(?:\.(?:x|\d+))?)?$", body)
              if not m:
                  return ("bad", f"'{s}' is not an explicit version pin")
              major = int(m.group(1))
              if major != OK_MAJOR:
                  return ("bad", f"node-version is '{s}' (major {major}), "
                                  f"expected {OK_MAJOR}.x")
              return ("ok",)

          try:
              import yaml  # noqa: F811
          except ImportError:
              print("::error::PyYAML is not available on this runner.")
              sys.exit(2)

          offenders = []
          for path in sorted(glob.glob(".github/workflows/*.y*ml")):
              with open(path) as fh:
                  doc = yaml.compose(fh)
              if not isinstance(doc, yaml.MappingNode):
                  continue
              jobs = get_mapping_value(doc, "jobs")
              if not isinstance(jobs, yaml.MappingNode):
                  continue
              for jkey, jval in jobs.value:
                  jname = scalar(jkey)
                  steps = get_mapping_value(jval, "steps")
                  if not isinstance(steps, yaml.SequenceNode):
                      continue
                  for idx, step in enumerate(steps.value, start=1):
                      if not isinstance(step, yaml.MappingNode):
                          continue
                      uses = scalar(get_mapping_value(step, "uses")) or ""
                      if "setup-node" not in uses:
                          continue
                      with_node = get_mapping_value(step, "with")
                      nv_node = (get_mapping_value(with_node, "node-version")
                                 if isinstance(with_node, yaml.MappingNode)
                                 else None)
                      if nv_node is None:
                          nvf = (get_mapping_value(with_node, "node-version-file")
                                 if isinstance(with_node, yaml.MappingNode)
                                 else None)
                          if nvf is not None:
                              offenders.append(
                                  f"{path}:{nvf.start_mark.line + 1} "
                                  f"(job '{jname}', step {idx}): uses "
                                  f"node-version-file ('{scalar(nvf)}') — pin "
                                  f"an explicit 24.x node-version instead")
                          else:
                              ref = ((with_node.start_mark.line + 1) if with_node
                                     else (step.start_mark.line + 1))
                              offenders.append(
                                  f"{path}:{ref} (job '{jname}', step {idx}): "
                                  f"node-version key is missing — pin "
                                  f"explicitly to 24.x")
                      else:
                          res = classify(scalar(nv_node))
                          if res[0] == "bad":
                              offenders.append(
                                  f"{path}:{nv_node.start_mark.line + 1} "
                                  f"(job '{jname}', step {idx}): {res[1]}")
          if offenders:
              print("::error::One or more setup-node steps are not explicitly "
                  "pinned to Node.js 24.x. Offending files and line numbers:")
              for o in offenders:
                  print(f"::error::{o}")
              sys.exit(1)
          print("All setup-node steps are explicitly pinned to Node.js 24.x.")
          PY

      - name: Enforce full commit SHA pins on third-party actions
        run: |
          # Supply-chain guard: any third-party action (an owner other than
          # `actions` or `github`) referenced from `uses:` must be pinned to a
          # full 40-character commit SHA, never a tag or branch — tags and
          # branches are mutable and can be repointed at malicious code.
          #
          # Parses YAML via yaml.compose (PyYAML, preinstalled on
          # ubuntu-latest), so comments and examples can never trigger a false
          # positive, and every offender is reported with file path + line.
          # Skipped: local actions (./path), docker:// references, and
          # first-party GitHub-owned actions.
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, sys

          try:
              import yaml
          except ImportError:
              print("::error::PyYAML is not available on this runner.")
              sys.exit(2)

          FIRST_PARTY = {"actions", "github"}
          SHA_RE = re.compile(r"^[0-9a-f]{40}$")

          def get(node, key):
              if not isinstance(node, yaml.MappingNode):
                  return None
              for k, v in node.value:
                  if isinstance(k, yaml.ScalarNode) and k.value == key:
                      return v
              return None

          def scalar(node):
              return node.value if isinstance(node, yaml.ScalarNode) else None

          def check(uses, path, line, where, offenders):
              if not uses or uses.startswith("./") or uses.startswith("docker://"):
                  return
              owner = uses.split("/", 1)[0]
              if owner in FIRST_PARTY:
                  return
              if "@" not in uses:
                  offenders.append(f"{path}:{line} ({where}): '{uses}' has no "
                                   f"ref — pin to a full 40-char commit SHA")
                  return
              repo, ref = uses.rsplit("@", 1)
              if not SHA_RE.match(ref):
                  offenders.append(
                      f"{path}:{line} ({where}): '{uses}' is pinned to "
                      f"'{ref}' (tag or branch) — pin to a full 40-char commit "
                      f"SHA, e.g. {repo}@<sha> # {ref}")

          offenders = []
          for path in sorted(glob.glob(".github/workflows/*.y*ml")):
              with open(path) as fh:
                  doc = yaml.compose(fh)
              jobs = get(doc, "jobs")
              if not isinstance(jobs, yaml.MappingNode):
                  continue
              for jkey, jval in jobs.value:
                  jname = scalar(jkey)
                  # Reusable-workflow call at the job level.
                  juses = get(jval, "uses")
                  if isinstance(juses, yaml.ScalarNode):
                      check(juses.value, path, juses.start_mark.line + 1,
                            f"job '{jname}'", offenders)
                  steps = get(jval, "steps")
                  if not isinstance(steps, yaml.SequenceNode):
                      continue
                  for idx, step in enumerate(steps.value, start=1):
                      u = get(step, "uses")
                      if isinstance(u, yaml.ScalarNode):
                          check(u.value, path, u.start_mark.line + 1,
                                f"job '{jname}', step {idx}", offenders)

          if offenders:
              print("::error::One or more third-party actions are not pinned to "
                    "a full commit SHA. Offending files and line numbers:")
              for o in offenders:
                  print(f"::error::{o}")
              sys.exit(1)
          print("All third-party actions are pinned to full commit SHAs.")
          PY

      - name: Enforce package.json engines.node is Node.js 24.x
        run: |
          # Keeps the declared runtime in lockstep with the setup-node pins:
          # package.json must declare engines.node, and that range must be
          # explicitly Node.js 24 (major 24 only). Accepted: 24, 24.x, ^24,
          # ~24.0.0, >=24, >=24 <25, 24.4.1. Rejected: a missing engines or
          # engines.node key, an empty value, wildcards (*, latest), and any
          # range that admits a major other than 24 (e.g. >=20, ^22 || ^24,
          # >=24 <26).
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys

          def fail(msg):
              print(f"::error file=package.json::{msg}")
              sys.exit(1)

          with open("package.json") as fh:
              pkg = json.load(fh)

          engines = pkg.get("engines")
          if not isinstance(engines, dict):
              fail("package.json is missing an \"engines\" object — add "
                   "\"engines\": { \"node\": \"24.x\" }")
          if "node" not in engines:
              fail("package.json engines is missing the \"node\" key — add "
                   "\"node\": \"24.x\"")

          raw = engines["node"]
          spec = str(raw).strip()
          if not spec:
              fail("package.json engines.node is empty — set it to \"24.x\"")
          if spec == "*" or spec.lower() == "latest":
              fail(f"package.json engines.node is '{spec}', which is not an "
                   f"explicit Node.js 24.x range — set it to \"24.x\"")
          if "||" in spec:
              fail(f"package.json engines.node is '{spec}'; an OR range admits "
                   f"majors other than 24 — set it to \"24.x\"")

          # Every comparator in the range must reference major 24, except an
          # upper bound of <25 / <=24.x which correctly closes the 24 range.
          parts = re.split(r"[\s,]+", spec.replace(" - ", " "))
          comparators = [p for p in parts if p]
          majors = set()
          for c in comparators:
              m = re.match(r"^(>=|<=|>|<|\^|~|=|v)?\s*v?(\d+)"
                           r"(?:\.(?:x|\*|\d+))?(?:\.(?:x|\*|\d+))?$", c)
              if not m:
                  fail(f"package.json engines.node contains '{c}', which is not "
                       f"a recognizable version comparator — set engines.node "
                       f"to \"24.x\"")
              op, major = m.group(1) or "", int(m.group(2))
              if op in ("<", "<=") and major in (24, 25):
                  continue  # valid upper bound closing the 24.x range
              majors.add(major)

          if majors != {24}:
              found = ", ".join(str(m) for m in sorted(majors)) or "none"
              fail(f"package.json engines.node is '{spec}' (major version(s): "
                   f"{found}) — it must be explicitly Node.js 24.x")

          print(f"package.json engines.node is '{spec}' — explicitly Node.js "
                f"24.x.")
          PY



